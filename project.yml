name: Vigor
options:
  bundleIdPrefix: com.example.vigor
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""          # 用户之后填入企业团队 ID
packages:
  VigorFIT:
    path: Packages/VigorFIT
  VigorScoring:
    path: Packages/VigorScoring
  VigorHealth:
    path: Packages/VigorHealth
  VigorStore:
    path: Packages/VigorStore
  VigorEngine:
    path: Packages/VigorEngine
  VigorDesign:
    path: Packages/VigorDesign
  VigorCoach:
    path: Packages/VigorCoach
targets:
  Vigor:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: VigorFIT
      - package: VigorScoring
      - package: VigorHealth
      - package: VigorStore
      - package: VigorEngine
      - package: VigorDesign
      - package: VigorCoach
      - target: VigorWidgets
        embed: true
      - target: VigorWatch
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 元气
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "5"
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: FIT 运动文件
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.garmin.fit
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: FIT 运动文件
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - fit
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.vigor.nightly
        UIBackgroundModes:
          - processing
          - fetch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: 元气需要读取睡眠、心率、心率变异性等健康数据，用于在本机计算恢复与睡眠分析。数据不会离开你的设备。
        NSHealthUpdateUsageDescription: 元气会在你进行晨测时写入正念记录。
    entitlements:
      path: App/Vigor.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.example.vigor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vigor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # 手表 App（PRD §6.8）：嵌入 iOS App 的 Watch/ 目录
  VigorWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [Watch]
    dependencies:
      - package: VigorScoring
      - package: VigorStore
      - package: VigorDesign
      - target: VigorWatchWidgets
        embed: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 元气
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "5"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.vigor
        UIBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: 元气需要读取心率与训练数据，用于训练模式中的实时负荷。数据不会离开你的设备。
        NSHealthUpdateUsageDescription: 元气会把训练模式的记录保存到“健康”。
    entitlements:
      path: Watch/VigorWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.example.vigor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vigor.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
  # 手表复杂功能（嵌入 VigorWatch.app/PlugIns）
  VigorWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [WatchWidgets]
    dependencies:
      - package: VigorScoring
      - package: VigorStore
      - package: VigorDesign
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: 元气
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/VigorWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.vigor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vigor.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
  # iOS 小组件（嵌入 Vigor.app/PlugIns）
  VigorWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Widgets]
    dependencies:
      - package: VigorScoring
      - package: VigorStore
      - package: VigorDesign
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 元气
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/VigorWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.vigor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vigor.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
